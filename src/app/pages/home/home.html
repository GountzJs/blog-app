<section
  class="flex items-center justify-center bg-linear-to-br from-sky-950 via-gray-900 via-20% to-gray-950 border-b-2 border-gray-800 w-full py-16"
>
  <hgroup class="flex flex-col gap-2 items-center">
    <h1 class="text-4xl font-black">Blog App</h1>
    <p class="text-lg opacity-80">A place to share your knowledge and ideas with the world</p>
  </hgroup>
</section>

<section class="flex justify-between flex-wrap-reverse gap-4 px-47.5 py-8">
  <app-list-articles [tag]="tag()" class="max-w-150 w-full"></app-list-articles>
  <app-list-tags class="w-full min-w-64 max-w-78"></app-list-tags>
  @if (tag()) {
    <div class="h-fit w-full">
      <button
        type="button"
        class="bg-gray-800 hover:opacity-80 transition-opacity duration-300 cursor-pointer flex items-center justify-center gap-2 text-xs font-medium border border-gray-800 rounded-full px-4 py-1"
        (click)="clearTag()"
      >
        {{ tag() }} <app-icons name="close" size="8px"></app-icons>
      </button>
    </div>
  }
</section>
