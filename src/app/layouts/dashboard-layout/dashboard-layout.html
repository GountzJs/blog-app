<section
  class="flex items-center justify-center bg-linear-to-br from-sky-950 via-gray-900 via-20% to-gray-950 border-b-2 border-gray-800 w-full py-16"
>
  <hgroup class="flex flex-col gap-2 items-center">
    <h1 class="text-4xl font-black">Blog App</h1>
    <p class="text-lg opacity-80">A place to share your knowledge and ideas with the world</p>
  </hgroup>
</section>

<section class="flex flex-col gap-4 px-47.5 py-8">
  <nav class="flex items-center gap-6 py-2 w-full">
    <a
      routerLink="/"
      aria-label="Go To Global feed"
      class="cursor-pointer text-sm font-medium opacity-60 px-4 py-2"
      [ngClass]="{
        'border-sky-500 border-b-2 opacity-100': isActive(''),
      }"
    >
      Global feed
    </a>
    <a
      routerLink="/feed"
      aria-label="Go To Your feed"
      class="cursor-pointer text-sm font-medium opacity-60 px-4 py-2"
      [ngClass]="{
        'border-sky-500 border-b-2 opacity-100': isActive('/feed'),
      }"
    >
      Your feed
    </a>
  </nav>

  <app-clear-tag [tag]="getTag()"></app-clear-tag>

  <article class="flex justify-between flex-wrap-reverse gap-4 w-full">
    <div class="max-w-150 w-full">
      <router-outlet></router-outlet>
    </div>

    <app-list-tags class="w-full min-w-64 max-w-78"></app-list-tags>
  </article>
</section>
