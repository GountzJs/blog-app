<ul class="flex flex-col gap-6 rounded-lg w-full">
  @for (article of articles(); track article.slug) {
    <li class="w-full">
      <a
        routerLink="/profile/@{{ article.author.username }}"
        class="outline outline-gray-800 hover:outline-2 duration-300 transition-colors hover:outline-sky-500 w-full rounded-lg p-4 flex flex-col gap-2"
      >
        <app-user-info
          [avatar]="article.author.image"
          [username]="article.author.username"
          [createdAt]="article.createdAt"
        ></app-user-info>
        <h2 class="text-xl font-bold">{{ article.title }}</h2>
        <p class="text-gray-400 text-sm font-medium">{{ article.description }}</p>
        <div class="flex justify-between gap-4 mt-4">
          <p class="text-xs font-regular opacity-60">Read more...</p>
          <ul class="flex flex-wrap gap-2">
            @for (tag of article.tagList; track tag) {
              <li
                class="bg-gray-800 text-xs font-regular opacity-60 border border-gray-800 rounded-full px-4 py-1"
              >
                {{ tag }}
              </li>
            }
          </ul>
        </div>
      </a>
    </li>
  }
</ul>

<app-infinite-scroll
  [noMoreItems]="noMoreItems()"
  [isLoading]="isLoading"
  (nextItems)="loadMore()"
></app-infinite-scroll>
