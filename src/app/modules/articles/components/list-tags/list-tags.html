<aside class="bg-gray-950 border border-sky-500 p-4 rounded-lg w-full">
  <p class="flex items-center gap-2 font-bold text-xl mb-8 w-full">
    <app-icons name="graph" color="var(--color-sky-500)"></app-icons>
    Popular Tags
  </p>
  <ul class="flex flex-wrap gap-2">
    @for (tag of tags(); track $index) {
      <li class="bg-gray-900 rounded-full px-4 py-1.5">{{ tag }}</li>
    }
  </ul>
  @if (errorMsg()) {
    <p class="text-red-500 font-semibold">{{ errorMsg() }}</p>
  }
  @if (isLoading()) {
    <p class="text-white font-semibold">Cargando etiquetas...</p>
  }
</aside>
